# Install as /etc/systemd/system/docker-digest-updater.service.d/deploy-telegram-notifier.conf
# The updater inherits these variables and therefore the notifier never needs
# secrets in a Compose file or in a command-line argument.
[Service]
EnvironmentFile=/etc/deploy-telegram-notifier.env
Environment=DEPLOY_TELEGRAM_NOTIFIER_BIN=/usr/local/bin/deploy-telegram-notifier
